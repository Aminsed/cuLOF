name: release

# Publishes to PyPI when a GitHub Release is published.
#
# Authentication is PyPI Trusted Publishing (OIDC): GitHub mints a short-lived
# token for this workflow and PyPI verifies it. No API token is stored in the
# repository, so there is nothing to leak or rotate.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build --sdist

      - name: Check metadata renders on PyPI
        run: python -m twine check --strict dist/*

      - name: Verify the sdist actually carries the sources
        # cuLOF ships source-only: pip compiles the CUDA extension on the
        # target machine. That makes a complete sdist load-bearing, and the
        # 0.1.0 release on PyPI shipped without a single .cu file, so it could
        # never build. Fail the release rather than publish that again.
        run: |
          set -euo pipefail
          for f in CMakeLists.txt src/cuda/knn.cu src/cuda/lof.cu \
                   src/cuda/pipeline.cu src/cuda/preprocess.cu \
                   src/cuda/binding.cpp include/culof.h \
                   include/culof_internal.cuh src/culof/__init__.py; do
            tar tzf dist/*.tar.gz | grep -q "/$f$" \
              || { echo "::error::sdist is missing $f"; exit 1; }
          done
          echo "sdist contains every file needed to build"

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: sdist
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
